name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: verify
        run: ./gradlew verify --stacktrace
      - name: lint の結果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # エミュレータでホームとして起動し、落ちないことを確かめ、画面を成果物に残す
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug
      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Android 17 の系の名前（android-37.0 など）に追いついていない runner の action は使わず、sdkmanager で直に立てる
      - name: エミュレータを立てて smoke を走らせる
        timeout-minutes: 25
        run: |
          set -x
          mkdir -p smoke
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          IMG=$(sdkmanager --list 2>/dev/null | grep -oE 'system-images;android-37[^ ;|]*;google_apis;x86_64' | sort -u | head -1)
          echo "system image: $IMG"
          test -n "$IMG"
          timeout 600 sdkmanager --install emulator platform-tools "$IMG" > /dev/null
          echo no | avdmanager create avd -n smoke -k "$IMG" -d pixel_7
          emulator -avd smoke -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on > smoke/emulator.log 2>&1 &
          timeout 300 adb wait-for-device
          timeout 600 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./.github/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
